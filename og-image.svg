  <!-- ═══ RIGHT: Decorative arch from website hero ═══ -->
  <g transform="translate(700, 15) scale(1.35)">
    <path d="M20,440 L20,200 Q20,20 170,20 Q320,20 320,200 L320,440 Z" fill="#e8d0b5"/>
